[package]
name = "arkecosystem-client"
version = "2.0.0"
authors = ["Joshua Noack <joshua@ark.io>, Kristjan Kosic <kristjan@ark.io>"]
description = "A simple Rust API client for the ARK Blockchain."
license = "MIT"
edition = "2024"

[lib]
name = "arkecosystem_client"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.52.1", default-features = false, features = ["macros"] }
serde = { version = "1.0.149", features = ["derive"] }
serde_json = "1.0.149"
serde_derive = "1.0.228"
rand = "0.8.5"

[dev-dependencies]
mockito = "0.27.0"

[features]
network_test = []
